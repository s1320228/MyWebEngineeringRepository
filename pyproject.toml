[project]
name = "MyWebEngineeringProject"
version = "0.1.0"
description = "Course project for Web Engineering"
requires-python = ">=3.14,<3.15"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0.7",
    "djangorestframework>=3.17.1",
    "gunicorn>=26.0.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "whitenoise>=6.12.0",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "--cov=."

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
]
