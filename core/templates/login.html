{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<h2>Login</h2>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <div class="container">
        <button class="btn btn-success">
            Login
        </button>
        <a href="{% url 'password_reset' %}">Password reset</a>
    </div>

</form>

</div>

{% endblock %}
