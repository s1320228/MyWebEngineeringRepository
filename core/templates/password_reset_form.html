<h1>Change Password</h1>
<h2>Enter your Email Address</h2>

<form method="post">
    {% ssrf_token %}
    <div class="mb-3">
        <label for="id_email" class="form-label">Mail Address</label>
        {{ form.email }}
        {{% if form.email.errors %}}
        <div class="text-danger-smaall">
            {{ form.email.errors }}
        </div>
        {{% endif %}}
    </div> 
    <div class="d-flex gap-2">
        <button type="submit" class="btn-primary"><i class="fas fa-paper-plane"></i>Submit</button>
        <a href="{% url 'login' %}" class="btn-secondary"><i class="fas fa-chevron-left"></i>Back to Login Screen</a>
    </div>
</form>
