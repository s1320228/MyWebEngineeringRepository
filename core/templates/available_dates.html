<div class="available-dates">
    <h2 class="available-dates__title">
        Recent Available Dates
    </h2>

    {% if message %}
        <p>{{ message }}</p>

    {% elif available_dates %}
        <ul>
            {% for available_date in available_dates %}
                <li>
                    {{ available_date|date:"Y-m-d" }}
                </li>
            {% endfor %}
        </ul>

    {% else %}
        <p>No available dates.</p>
    {% endif %}
</div>
